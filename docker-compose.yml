# Absolute Cinema — `docker compose up -d` and open http://localhost:3000
#
# Nothing here needs editing for a first run. The first account you create
# becomes the admin; add your TMDB key and Real-Debrid token in Settings.
# Every value below can be overridden from a `.env` file (see .env.example).

services:
  absolute-cinema:
    container_name: absolute-cinema
    image: absolute-cinema:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PLAYBACK_RANDOM_ACCESS_REMUX: ${NEXT_PUBLIC_PLAYBACK_RANDOM_ACCESS_REMUX:-1}
    ports:
      # Only the web app is published. The stream scraper (:3030) stays
      # inside the container and must never be exposed.
      - "${AC_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - HOSTNAME=0.0.0.0
      # Remux rewraps MKV releases (where most 4K lives) into a browser-playable
      # container with `-c copy`: no re-encode, ~10x realtime, I/O bound.
      - REMUX_ENABLED=${REMUX_ENABLED:-1}
      # Full re-encoding is CPU-heavy (a cold 4K HEVC job can use >10 cores),
      # so it is off unless you opt in.
      - TRANSCODER_ENABLED=${TRANSCODER_ENABLED:-0}
      # Disk budget for remuxed files. Must be >= the per-job cap.
      - TRANSCODER_CACHE_MAX_BYTES=${TRANSCODER_CACHE_MAX_BYTES:-107374182400}
      - TRANSCODER_CACHE_TTL_MS=${TRANSCODER_CACHE_TTL_MS:-43200000}
      - TRANSCODER_REMUX_MIN_FREE_BYTES=${TRANSCODER_REMUX_MIN_FREE_BYTES:-26843545600}
      - TRANSCODER_REMUX_MAX_JOB_BYTES=${TRANSCODER_REMUX_MAX_JOB_BYTES:-103079215104}
      # Warm headless-Chromium workers used by embed providers (1-4).
      - BROWSER_POOL_SIZE=${BROWSER_POOL_SIZE:-1}
      - PROVIDER_CINEPRO=${PROVIDER_CINEPRO:-0}
      - SOURCE_MEMORY_DIR=/app/data/source-memory
    volumes:
      # Accounts, watch history, settings and the remembered-source index.
      - ./db:/app/db
      # Which servers played each title (and at what quality), so the next
      # Play skips the search. Survives rebuilds.
      - ./data/source-memory:/app/data/source-memory
      # Remuxed 4K files; regenerable, bounded by the settings above.
      - ./transcode-cache:/app/transcode-cache
    shm_size: "2gb"
    restart: unless-stopped
    # Explicit resolvers keep provider/Real-Debrid lookups working when the
    # host's DNS (VPN overlays, Pi-hole outages) misbehaves.
    dns:
      - ${AC_DNS_PRIMARY:-1.1.1.1}
      - ${AC_DNS_FALLBACK:-8.8.8.8}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3000/api/health >/dev/null && curl -sf http://127.0.0.1:3030/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
