name: Bug report
description: Something is broken or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: Title / episode (for playback issues)
      placeholder: "e.g. Dune: Part Two, or Severance S02E03"
  - type: dropdown
    id: browser
    attributes:
      label: Browser / device
      options: [Chrome, Safari, Firefox, Edge, iPhone / iPad, Android, Smart TV, Other]
  - type: dropdown
    id: debrid
    attributes:
      label: Is Real-Debrid connected?
      options: ["Yes", "No"]
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "git rev-parse --short HEAD"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: "Output of `docker compose logs --tail=200` around the time of the problem. Remove any tokens."
      render: shell
